<!-- =============================
File: results.html  (Live leaderboard)
============================= -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Who Would Win? — Results</title>
  <style>
    :root { --bg:#0b1020; --card:#121a35; --muted:#93a1c8; --text:#e6e9f5; --accent:#5cc8ff; }
    body{margin:0;font-family:system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial; background:linear-gradient(180deg,#0b1020,#0e1530); color:var(--text);} 
    .wrap{max-width:900px;margin:0 auto;padding:24px}
    header{display:flex;align-items:center;justify-content:space-between}
    header a{color:var(--accent);text-decoration:none}
    h1{font-size:28px;margin:8px 0}
    .table{width:100%;border-collapse:separate;border-spacing:0 10px}
    .row{background:var(--card); border:1px solid #1f2b55; border-radius:14px; padding:10px}
    .row td{padding:12px 14px}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Who Would Win? <span class="muted">(Results)</span></h1>
        <div class="muted">Live ELO ranking. Updates immediately after every vote.</div>
      </div>
      <nav><a href="./">← Back to voting</a></nav>
    </header>

    <table class="table" id="board"></table>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

  <script type="module">
    // Same config as index.html
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "",
      appId: ""
    };
    const EVENT_ID = 'default';
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const playersRef = db.collection('players');

    const board = document.getElementById('board');

    function render(rows){
      board.innerHTML = '';
      const header = document.createElement('tr');
      header.className = 'row';
      header.innerHTML = `<td>#</td><td>Name</td><td>ELO</td><td>W-L</td>`;
      board.appendChild(header);
      rows.forEach((p, i) => {
        const tr = document.createElement('tr');
        tr.className = 'row';
        tr.innerHTML = `<td>${i+1}</td><td>${p.name}</td><td>${p.rating.toFixed(0)}</td><td>${p.wins||0}-${p.losses||0}</td>`;
        board.appendChild(tr);
      });
    }

    playersRef.where('active','==', true).orderBy('rating','desc').onSnapshot(snap => {
      const rows = snap.docs.map(d => d.data());
      render(rows);
    });
  </script>
</body>
</html>
